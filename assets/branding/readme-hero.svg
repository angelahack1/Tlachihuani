<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Tlachihuani — Windows services and Torrenter</title>
  <desc id="hero-description">The XT tray connects Windows services, the Torrenter workspace and its local REST API.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1521"/>
      <stop offset="0.52" stop-color="#080F19"/>
      <stop offset="1" stop-color="#102023"/>
    </linearGradient>
    <linearGradient id="title-color" x1="384" y1="164" x2="902" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFF"/>
      <stop offset="0.54" stop-color="#E8FCF8"/>
      <stop offset="1" stop-color="#96E8DC"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="230" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162530"/>
      <stop offset="1" stop-color="#101B25"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#6C9DAB" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- A quiet technical canvas: all artwork is local, editable SVG. -->
  <rect x="1" y="1" width="1278" height="418" rx="24" fill="url(#background)" stroke="#29404A"/>
  <rect x="20" y="20" width="1240" height="380" rx="16" fill="url(#grid)"/>

  <!-- Broken orbital arcs keep the centre open for the name. -->
  <g stroke="#5ECDBD" stroke-opacity="0.13" stroke-width="1.2">
    <path d="M341 156C397 73 517 47 640 47C763 47 883 73 939 156"/>
    <path d="M341 272C397 350 517 376 640 376C763 376 883 350 939 272"/>
    <path d="M413 129C469 90 548 76 640 76C732 76 811 90 867 129"/>
    <path d="M413 299C469 338 548 352 640 352C732 352 811 338 867 299"/>
  </g>
  <g stroke="#CDA56A" stroke-opacity="0.38" stroke-width="1.4" stroke-linecap="round">
    <path d="M517 61C539 55 563 51 588 49"/>
    <path d="M745 370C770 366 794 360 815 353"/>
  </g>
  <circle cx="588" cy="49" r="3" fill="#DDBB81"/>
  <circle cx="815" cy="353" r="3" fill="#DDBB81"/>

  <!-- Four routes, one workbench. -->
  <g stroke="#68CFBE" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 140H313L347 174H366"/>
    <path d="M270 290H313L347 256H366"/>
    <path d="M1010 140H967L933 174H914"/>
    <path d="M1010 290H967L933 256H914"/>
  </g>
  <g fill="#0D1922" stroke="#72D9C8" stroke-width="1.6">
    <circle cx="366" cy="174" r="3.5"/>
    <circle cx="366" cy="256" r="3.5"/>
    <circle cx="914" cy="174" r="3.5"/>
    <circle cx="914" cy="256" r="3.5"/>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="640" y="130" fill="#E1BE82" font-size="17" letter-spacing="5">XAIHT  /  WINDOWS</text>
    <text x="640" y="211" fill="url(#title-color)" font-size="69" font-weight="700" letter-spacing="2">TLACHIHUANI</text>
    <text x="640" y="263" fill="#DCEEEB" font-size="25">Windows services from the system tray</text>
    <path d="M609 301H671" stroke="#DDBB81" stroke-width="2"/>
  </g>
  <g transform="translate(40 90)">
    <rect width="230" height="100" rx="16" fill="url(#card)" stroke="#2A4650"/>
    <path d="M16 1H57" stroke="#7CE1CF" stroke-width="2"/>
    <path d="M28 51H37L43 58H51L57 51H66L60 34H34ZM28 51V66H66V51" stroke="#7CE1CF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="57" fill="#DCEEEB" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="1">XT TRAY</text>
  </g>
  <g transform="translate(40 240)">
    <rect width="230" height="100" rx="16" fill="url(#card)" stroke="#2A4650"/>
    <path d="M16 1H57" stroke="#E1BE82" stroke-width="2"/>
    <path d="M28 38H66M28 60H66M39 32V44M54 54V66" stroke="#E1BE82" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="57" fill="#DCEEEB" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="1">SERVICES</text>
  </g>
  <g transform="translate(1010 90)">
    <rect width="230" height="100" rx="16" fill="url(#card)" stroke="#2A4650"/>
    <path d="M16 1H57" stroke="#E1BE82" stroke-width="2"/>
    <path d="M47 29V56M36 45L47 56L58 45M29 57V66H65V57" stroke="#E1BE82" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="57" fill="#DCEEEB" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="1">TORRENTER</text>
  </g>
  <g transform="translate(1010 240)">
    <rect width="230" height="100" rx="16" fill="url(#card)" stroke="#2A4650"/>
    <path d="M16 1H57" stroke="#7CE1CF" stroke-width="2"/>
    <path d="M37 36L24 49L37 62M57 36L70 49L57 62M52 31L42 67" stroke="#7CE1CF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="57" fill="#DCEEEB" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="1">REST API</text>
  </g>
  <text x="640" y="400" fill="#79929E" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="13" letter-spacing="0.4">Created by Angela López Mendoza</text>
</svg>
